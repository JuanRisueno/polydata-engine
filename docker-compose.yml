services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pde_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    command: uvicorn src.pde.api.main:app --host 0.0.0.0 --port 8000 --reload
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pde_frontend
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Sobrescribe la URL local del .env para la red interna de Compose
      - PDE_API_URL=http://api:8000
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0 --browser.gatherUsageStats=false
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M