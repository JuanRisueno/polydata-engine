# ==============================================================================
# CONFIGURACIÓN DE PRUEBAS AUTOMATIZADAS (Pytest)
# ==============================================================================

[pytest]
# Configuración de rutas e importaciones: incluye la raíz del proyecto en sys.path
# para permitir importaciones directas de la carpeta 'src'
pythonpath = .
testpaths = tests

# Redirigir el caché a /tmp para evitar conflictos de permisos con volúmenes montados
cache_dir = /tmp/.pytest_cache

# Patrones explícitos de descubrimiento de pruebas
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto al ejecutar pytest:
# -v: Salida detallada (verbose) con el nombre de cada test ejecutado
# --strict-markers: Valida que solo se usen marcadores registrados
addopts = -v --strict-markers